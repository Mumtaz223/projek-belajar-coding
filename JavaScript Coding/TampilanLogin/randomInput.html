<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>input box</title>
	<link rel="stylesheet" href="style.html">
	<style type="text/css">
		body{
			background-color: whitesmoke;
			
		}
		input[type="text"]{
			all: unset;
			padding: 15PX;
			border-radius: 13px;
			border: 2px solid transparent;
			box-shadow: 0px 2px 2px 2px rgba(1, 0, 1, 0.088);
			transition: border .3s ease-in-out;

		}
		input[type="text"]:placeholder{
			font-size: 9rem;
			color: rgb(0, 255, 64);

		}
		input[type="text"]:focus{
			border-color: #94f9bb;
		}
		input[type="text"]:hover{
			border-color: #A594F9;
		}
		button{
			all: unset;
			box-shadow: 0px 2px 2px 2px rgba(1, 1, 1, 0.088);
			border-radius: 13px;
			padding: 15px;
			transition: border .5s ease-in-out;
			border: 2px solid transparent;
			width: 150px;
			background-color: aqua;
		}
		button:focus{
			border-color: ;
		}
		button:placeholder{
			font-size: 9rem;
		}
		button:hover{
			border-color: #A594F9;
			background-color: #A594F9;
		}
		button:active{
			background-color: #CDC1FF;
		}
		div{
			border-radius: 13px;
			border: 2px solid;
			border-color: #A594F9;	
			padding: 15px;
			width: 300px;
			height: 400px;
			margin: 0 auto;
			text-align: center;
			 backdrop-filter: blur(5px); 
			}
			h1{
				font-family: sans-serif;
				color: #A594F9;
				font-weight: 300px;
			}
			input[type="checkbox"]{
				text-align: center;
			}
			h5{
				color: black;
				font-family: sans-serif;
			}
			input[type="password"]{
			all: unset;
			padding: 15PX;
			border-radius: 13px;
			border: 2px solid transparent;
			box-shadow: 0px 2px 2px 2px rgba(1, 0, 1, 0.088);
			transition: border .3s ease-in-out;

		}
		input[type="password"]:placeholder{
			font-size: 9rem;
			color: black;

		}
		input[type="passsword"]:focus{
			border-color: #A594F9;
		}
		input[type="password"]:hover{
			border-color: #A594F9;
		}
	</style>
</head>
<body>
	<div>
		<h1>Login Account</h1>
	<input type="text" name="Nama" placeholder="Masukkan Nama" id="Nama-user"><br><br>
	<input type="password" name="Password" placeholder="Password"><br><br>
	
	<button type="submit">Login</button><br><br>
	<h5>or use your account</h3>
</div>
	
<script src="login.js"></script>
</body>
</html>
