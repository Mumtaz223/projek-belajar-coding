<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projek dom kedua</title>
    <style type="text/css">
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container{
            width: 400px;
            padding: 25px;
            background-color: rgb(12, 199, 168);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1);
            border: 2px solid;
            border-color: blueviolet;
        }
        texttarea{
            width: 100%;
            height: 120px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box; /*biar padding ga lebar*/
            font-size: 16px;
        }
        #counter{
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h2>Tulis Postingan Kalian</h2>
        <textarea id="post-input" maxlength="600" placeholder="Apa Yang kamu pikirkan?"></textarea>
        <p id="counter">600/600</p>
    </div>
    <script src="Dom2.js"></script>
</body>
</html>
